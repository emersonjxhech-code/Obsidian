<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">French History: Chapter 18 Visual Timeline</title>
  <desc id="desc">A visual timeline from the French Wars of Religion through the Franco-Prussian War.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e8"/>
      <stop offset="1" stop-color="#e7edf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263238" flood-opacity=".14"/>
    </filter>
    <style>
      .title { font: 700 42px Georgia, serif; fill: #172a3a; }
      .subtitle { font: 400 18px Georgia, serif; fill: #52616b; }
      .year { font: 700 22px Georgia, serif; fill: #b64835; }
      .event { font: 700 19px Georgia, serif; fill: #172a3a; }
      .detail { font: 400 16px Georgia, serif; fill: #52616b; }
      .small { font: 700 14px Arial, sans-serif; letter-spacing: 2px; fill: #b64835; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 720 C260 650 420 790 680 715 S1120 625 1600 725 L1600 900 L0 900 Z" fill="#d8e1df" opacity=".55"/>
  <path d="M0 120 C240 180 410 60 650 130 S1100 205 1600 105" fill="none" stroke="#c6d4d4" stroke-width="3" opacity=".8"/>

  <text x="100" y="100" class="small">CHAPTER 18</text>
  <text x="100" y="155" class="title">French History in Motion</text>
  <text x="100" y="192" class="subtitle">From religious conflict and absolute monarchy to revolution, empire, and national power</text>

  <g filter="url(#shadow)">
    <rect x="100" y="245" width="1400" height="500" rx="18" fill="#fffdf9"/>
  </g>

  <line x1="180" y1="495" x2="1420" y2="495" stroke="#b64835" stroke-width="8" stroke-linecap="round"/>

  <g>
    <circle cx="205" cy="495" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="205" y1="480" x2="205" y2="375" stroke="#b64835" stroke-width="3"/>
    <text x="205" y="335" text-anchor="middle" class="year">1562</text>
    <text x="205" y="365" text-anchor="middle" class="event">Wars of Religion</text>
    <text x="205" y="390" text-anchor="middle" class="detail">begin in France</text>
  </g>

  <g>
    <circle cx="405" cy="495" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="405" y1="510" x2="405" y2="615" stroke="#b64835" stroke-width="3"/>
    <text x="405" y="655" text-anchor="middle" class="year">1598</text>
    <text x="405" y="685" text-anchor="middle" class="event">Edict of Nantes</text>
    <text x="405" y="710" text-anchor="middle" class="detail">Henry IV grants toleration</text>
  </g>

  <g>
    <circle cx="605" cy="495" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="605" y1="480" x2="605" y2="375" stroke="#b64835" stroke-width="3"/>
    <text x="605" y="335" text-anchor="middle" class="year">1643</text>
    <text x="605" y="365" text-anchor="middle" class="event">Louis XIV</text>
    <text x="605" y="390" text-anchor="middle" class="detail">begins his reign</text>
  </g>

  <g>
    <circle cx="805" cy="495" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="805" y1="510" x2="805" y2="615" stroke="#b64835" stroke-width="3"/>
    <text x="805" y="655" text-anchor="middle" class="year">1789</text>
    <text x="805" y="685" text-anchor="middle" class="event">French Revolution</text>
    <text x="805" y="710" text-anchor="middle" class="detail">begins with the Bastille</text>
  </g>

  <g>
    <circle cx="1005" cy="495" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="1005" y1="480" x2="1005" y2="375" stroke="#b64835" stroke-width="3"/>
    <text x="1005" y="335" text-anchor="middle" class="year">1804</text>
    <text x="1005" y="365" text-anchor="middle" class="event">Napoleon becomes</text>
    <text x="1005" y="390" text-anchor="middle" class="detail">Emperor of France</text>
  </g>

  <g>
    <circle cx="1205" cy="495" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="1205" y1="510" x2="1205" y2="615" stroke="#b64835" stroke-width="3"/>
    <text x="1205" y="655" text-anchor="middle" class="year">1815</text>
    <text x="1205" y="685" text-anchor="middle" class="event">Congress of Vienna</text>
    <text x="1205" y="710" text-anchor="middle" class="detail">Europe's map is redrawn</text>
  </g>

  <g>
    <circle cx="1405" cy="495" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="1405" y1="480" x2="1405" y2="375" stroke="#b64835" stroke-width="3"/>
    <text x="1405" y="335" text-anchor="middle" class="year">1870–71</text>
    <text x="1405" y="365" text-anchor="middle" class="event">Franco-Prussian</text>
    <text x="1405" y="390" text-anchor="middle" class="detail">War reshapes Europe</text>
  </g>

  <text x="100" y="820" class="subtitle">Key arc: religious division → absolute monarchy → revolution → empire → restoration → nationalism</text>
</svg>
