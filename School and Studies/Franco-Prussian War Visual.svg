<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Franco-Prussian War, 1870–1871</title>
  <desc id="desc">A visual explanation of the causes, turning points, and outcome of the Franco-Prussian War.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f3"/>
      <stop offset="1" stop-color="#f8eee5"/>
    </linearGradient>
    <linearGradient id="prussia" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e5266"/>
      <stop offset="1" stop-color="#193746"/>
    </linearGradient>
    <linearGradient id="france" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7473a"/>
      <stop offset="1" stop-color="#842f32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263238" flood-opacity=".16"/>
    </filter>
    <style>
      .title { font: 700 45px Georgia, serif; fill: #172a3a; }
      .subtitle { font: 400 19px Georgia, serif; fill: #52616b; }
      .label { font: 700 14px Arial, sans-serif; letter-spacing: 2px; fill: #b64835; }
      .cardtitle { font: 700 24px Georgia, serif; fill: #172a3a; }
      .body { font: 400 17px Georgia, serif; fill: #52616b; }
      .white { fill: #fffdf9; }
      .year { font: 700 22px Georgia, serif; fill: #b64835; }
      .event { font: 700 19px Georgia, serif; fill: #172a3a; }
      .small { font: 400 15px Georgia, serif; fill: #52616b; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <path d="M0 760 C260 670 410 825 680 740 S1160 650 1600 760 L1600 1000 L0 1000 Z" fill="#d8e1df" opacity=".62"/>
  <path d="M0 170 C240 90 430 220 700 145 S1180 70 1600 175" fill="none" stroke="#c9d6d6" stroke-width="3"/>

  <text x="100" y="90" class="label">EUROPEAN HISTORY · 1870–1871</text>
  <text x="100" y="148" class="title">The Franco-Prussian War</text>
  <text x="100" y="184" class="subtitle">A succession dispute becomes a war that transforms the balance of power in Europe</text>

  <g filter="url(#shadow)">
    <rect x="100" y="225" width="1400" height="205" rx="18" fill="#fffdf9"/>
    <rect x="100" y="470" width="1400" height="390" rx="18" fill="#fffdf9"/>
  </g>

  <text x="140" y="275" class="label">WHY IT STARTED</text>
  <text x="140" y="320" class="cardtitle">The Spanish succession crisis</text>
  <text x="140" y="355" class="body">Spain offered its vacant throne to Prince Leopold of Hohenzollern,</text>
  <text x="140" y="382" class="body">a relative of Prussia's king. France feared encirclement by Hohenzollern rulers.</text>
  <path d="M1160 286 L1198 324 L1160 362" fill="none" stroke="#b64835" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1260" y="315" text-anchor="middle" class="cardtitle">Bismarck's tactic</text>
  <text x="1260" y="350" text-anchor="middle" class="body">The edited Ems Dispatch</text>
  <text x="1260" y="377" text-anchor="middle" class="body">made the dispute appear insulting.</text>

  <text x="140" y="520" class="label">THE WAR UNFOLDS</text>
  <line x1="210" y1="650" x2="1390" y2="650" stroke="#b64835" stroke-width="8" stroke-linecap="round"/>

  <g>
    <circle cx="220" cy="650" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="220" y1="635" x2="220" y2="565" stroke="#b64835" stroke-width="3"/>
    <text x="220" y="555" text-anchor="middle" class="year">July 1870</text>
    <text x="220" y="705" text-anchor="middle" class="event">France declares war</text>
    <text x="220" y="733" text-anchor="middle" class="small">Prussia gains German support</text>
  </g>

  <g>
    <circle cx="510" cy="650" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="510" y1="665" x2="510" y2="735" stroke="#b64835" stroke-width="3"/>
    <text x="510" y="790" text-anchor="middle" class="year">Aug. 1870</text>
    <text x="510" y="845" text-anchor="middle" class="event">Early Prussian victories</text>
    <text x="510" y="873" text-anchor="middle" class="small">French armies are pushed back</text>
  </g>

  <g>
    <circle cx="800" cy="650" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="800" y1="635" x2="800" y2="565" stroke="#b64835" stroke-width="3"/>
    <text x="800" y="555" text-anchor="middle" class="year">Sept. 1870</text>
    <text x="800" y="705" text-anchor="middle" class="event">Sedan</text>
    <text x="800" y="733" text-anchor="middle" class="small">Napoleon III is captured</text>
  </g>

  <g>
    <circle cx="1090" cy="650" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="1090" y1="665" x2="1090" y2="735" stroke="#b64835" stroke-width="3"/>
    <text x="1090" y="790" text-anchor="middle" class="year">Sept. 1870–Jan. 1871</text>
    <text x="1090" y="845" text-anchor="middle" class="event">Siege of Paris</text>
    <text x="1090" y="873" text-anchor="middle" class="small">France continues resistance</text>
  </g>

  <g>
    <circle cx="1380" cy="650" r="15" fill="#fffdf9" stroke="#b64835" stroke-width="7"/>
    <line x1="1380" y1="635" x2="1380" y2="565" stroke="#b64835" stroke-width="3"/>
    <text x="1380" y="555" text-anchor="middle" class="year">Jan. 1871</text>
    <text x="1380" y="705" text-anchor="middle" class="event">German Empire formed</text>
    <text x="1380" y="733" text-anchor="middle" class="small">Treaty follows in May 1871</text>
  </g>

  <rect x="150" y="905" width="600" height="50" rx="10" fill="url(#prussia)"/>
  <text x="450" y="938" text-anchor="middle" class="white" style="font:700 17px Georgia,serif">RESULT: Prussian-led German unification</text>
  <rect x="850" y="905" width="600" height="50" rx="10" fill="url(#france)"/>
  <text x="1150" y="938" text-anchor="middle" class="white" style="font:700 17px Georgia,serif">RESULT: France loses Alsace-Lorraine</text>
</svg>
